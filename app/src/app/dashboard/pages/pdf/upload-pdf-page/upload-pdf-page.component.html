<div class="container my-5">
  <h1>Carga de templates</h1>
  <div class="row">
    <!-- Lado izquierdo con entrada de nombre y código EJS -->
    <div class="col-md-8">
      <form
        id="templateForm"
        [formGroup]="myForm"
        (ngSubmit)="uploadTemplate()"
      >
        <div class="mb-3">
          <label for="templateName" class="form-label"
            >Nombre del Template</label
          >
          <input
            type="text"
            class="form-control"
            id="templateName"
            formControlName="nombre"
          />
          <span *ngIf="isValidField('nombre')" class="form-text text-danger">
            {{ getFieldError("nombre") }}
          </span>
        </div>
        <div class="mb-3">
          <label for="ejsCode" class="form-label">Código EJS</label>
          <textarea
            class="form-control"
            id="ejsCode"
            formControlName="template"
            rows="20"
            (input)="updatePreview()"
          ></textarea>
          <span *ngIf="isValidField('template')" class="form-text text-danger">
            {{ getFieldError("nombre") }}
          </span>
        </div>
        <button type="submit" class="btn btn-primary">Cargar template</button>
      </form>
    </div>
    <!-- Lado derecho para la vista previa en HTML -->
    <div class="col-md-4">
      <h2>Variables EJS</h2>
      <form [formGroup]="variableForm">
        <div *ngFor="let variable of variables; let i = index" class="mb-3">
          <div class="row">
            <div class="col-md-6">
              <label for="nombre{{ i }}" class="form-label">Nombre:</label>
              <input
                type="text"
                class="form-control"
                [id]="'nombre' + i"
                formControlName="nombre{{ i }}"
              />
            </div>
            <div class="col-md-6">
              <label for="valor{{ i }}" class="form-label">Valor:</label>
              <input
                type="text"
                class="form-control"
                [id]="'valor' + i"
                formControlName="valor{{ i }}"
              />
            </div>
          </div>
        </div>
        <div class="d-flex justify-content-between">
          <button
            type="button"
            class="btn btn-outline-primary"
            (click)="addVariable()"
          >
            Crear Variable
          </button>
          <button
            type="button"
            class="btn btn-success"
            (click)="updatePreview()"
          >
            Actualizar Vista Previa
          </button>
        </div>
      </form>
    </div>
    <div class="col">
      <h5 class="text-center">Vista previa HTML</h5>
      <div class="card mb-5 p-2" style="width: 100%; height: 50vh">
        <iframe
          id="previewFrame"
          class="card-img-bottom"
          style="width: 100%; height: 100%"
        ></iframe>
      </div>
    </div>
  </div>
</div>
