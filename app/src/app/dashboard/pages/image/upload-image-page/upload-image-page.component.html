<div class="container mt-5">
  <h1>Subir Imágenes</h1>
  <form [formGroup]="myForm" (ngSubmit)="onSubmit()">
    <div class="form-group mb-2">
      <label for="foto">Selecciona una imagen:</label>
      <input
        type="file"
        id="foto"
        class="form-control"
        formControlName="foto"
        (change)="onFileSelected($event)"
      />
      <span
        *ngIf="
          myForm.get('foto')?.touched &&
          myForm.get('foto')?.hasError('required')
        "
        class="form-text text-danger"
      >
        {{ customErrorMessages.required }}
      </span>
      <span
        *ngIf="myForm.get('foto')?.hasError('invalidMimeType')"
        class="form-text text-danger"
      >
        {{ customErrorMessages.invalidMimeType }}
      </span>
    </div>
    <div class="form-group mb-2">
      <label for="descripcion">Descripción:</label>
      <input
        type="text"
        id="descripcion"
        class="form-control"
        formControlName="descripcion"
        placeholder="Ingrese una descripción"
      />

      <span *ngIf="isValidField('descripcion')" class="form-text text-danger">
        Campo requerido
      </span>
    </div>
    <button type="submit" class="btn btn-primary">Subir Imagen</button>
  </form>

  <hr />

  <h2>Administrar imágenes</h2>

  <dashboard-image-table [images]="images" [loading]="loading" />
</div>
