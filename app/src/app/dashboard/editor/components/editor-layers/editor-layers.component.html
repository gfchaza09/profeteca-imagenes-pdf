<div class="editor-layers px-3 py-2">
  <h6 class="text-uppercase text-muted small mb-2">Capas</h6>
  <ul class="list-group list-group-flush small">
    <li
      class="list-group-item py-1 px-0 d-flex justify-content-between align-items-center"
      *ngFor="let layer of layers"
    >
      <button type="button" class="btn btn-link btn-sm p-0 text-start" (click)="selectLayer.emit(layer.id)">
        {{ layer.label }}
      </button>
      <span class="badge text-bg-light">{{ layer.type }}</span>
    </li>
  </ul>
</div>
