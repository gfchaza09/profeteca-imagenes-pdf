<div class="editor-root d-flex flex-column vh-100-minus-nav">
  <app-editor-toolbar
    [formatId]="formatId"
    [canUndo]="canUndo"
    [canRedo]="canRedo"
    (formatChange)="onFormatChange($event)"
    (newDesign)="onNewDesign()"
    (undo)="onUndo()"
    (redo)="onRedo()"
    (exportPng)="onExportPng()"
    (exportJson)="onExportJson()"
    (importJson)="onImportJson()"
  />

  <div class="editor-body d-flex flex-grow-1 overflow-hidden">
    <app-editor-sidebar
      [templates]="templates"
      [backgroundFit]="backgroundFit"
      (addImage)="onAddImage($event)"
      (addText)="onAddText($event)"
      (applyTemplate)="onApplyTemplate($event)"
      (backgroundFile)="onBackgroundFile($event)"
      (backgroundFitChange)="onBackgroundFitChange($event)"
      (applyBuiltInBackground)="onBuiltInBackground()"
    />

    <div class="editor-center flex-grow-1 d-flex flex-column min-w-0">
      <div #viewport class="canvas-viewport flex-grow-1 d-flex align-items-center justify-content-center">
        <div
          class="canvas-scale-wrapper"
          [style.width.px]="canvasWidth * viewScale"
          [style.height.px]="canvasHeight * viewScale"
        >
          <div
            class="canvas-inner"
            [style.transform]="'scale(' + viewScale + ')'"
            [style.width.px]="canvasWidth"
            [style.height.px]="canvasHeight"
          >
            <canvas #fabricCanvas></canvas>
          </div>
        </div>
      </div>
      <app-editor-layers [layers]="layers" (selectLayer)="onSelectLayer($event)" />
    </div>

    <app-editor-properties
      [hasSelection]="hasSelection"
      [isText]="isText"
      [isImage]="isImage"
      [textProps]="textProps"
      [imageProps]="imageProps"
      (textChange)="onTextChange($event)"
      (imageChange)="onImageChange($event)"
      (duplicate)="onDuplicate()"
      (delete)="onDelete()"
      (bringForward)="onBringForward()"
      (sendBackward)="onSendBackward()"
    />
  </div>
</div>
