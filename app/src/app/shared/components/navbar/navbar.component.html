<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/dashboard">
      <img
        class="rounded"
        src="assets/icon.png"
        alt="Profeteca"
        width="40"
        height="40"
      />
      <span class="fw-semibold text-primary">Profeteca</span>
    </a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav ms-lg-5 me-auto mb-2 mb-lg-0 gap-lg-5">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/dashboard"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <i class="fas fa-palette"></i> Editor
          </a>
        </li>
        <li class="nav-item dropdown">
          <a
            class="nav-link dropdown-toggle"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <i class="fas fa-file-pdf"></i> PDF <small class="text-muted">(requiere DB)</small>
          </a>
          <ul class="dropdown-menu">
            <li *ngFor="let menuItem of pdfItems">
              <a
                class="dropdown-item"
                routerLinkActive="active"
                aria-current="page"
                [routerLink]="menuItem.route"
              >
                <i [class]="menuItem.icon"></i> {{ menuItem.title }}</a
              >
            </li>
          </ul>
        </li>
      </ul>
      <div class="d-flex gap-2 align-items-center me-4" *ngIf="!localMode">
        <button class="btn btn-outline-danger btn-sm" (click)="logout()">
          Salir
        </button>
      </div>
    </div>
  </div>
</nav>
