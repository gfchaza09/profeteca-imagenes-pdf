<div class="container my-5">
  <h1>Configuraciones</h1>
  <div class="row">
    <!-- Columna para el formulario de entrada de datos -->
    <div class="col-md-6">
      <form [formGroup]="myForm" (ngSubmit)="onSubmit()">
        <div class="form-group mb-2">
          <label for="name">Nombre de configuración:</label>
          <input
            type="text"
            id="name"
            formControlName="name"
            class="form-control"
          />
          <span *ngIf="isValidField('name')" class="form-text text-danger">
            {{ getFieldError("name") }}
          </span>
        </div>

        <div class="form-group row mb-2">
          <div class="col-md-6">
            <label for="text1">Texto 1 de prueba:</label>
            <input
              type="text"
              id="text1"
              formControlName="text1"
              class="form-control"
            />
          </div>
          <div class="col-md-6">
            <label for="text2">Texto 2 de prueba:</label>
            <input
              type="text"
              id="text2"
              formControlName="text2"
              class="form-control"
            />
          </div>
        </div>

        <div class="form-group mb-2">
          <label for="backgroundImage">Imagen de fondo:</label>
          <select
            id="backgroundImage"
            formControlName="backgroundImage"
            (change)="onImageSelected($event)"
            class="form-control"
          >
            <option *ngFor="let image of images" [value]="image.id">
              {{ image.descripcion }}
            </option>
          </select>
          <span
            *ngIf="isValidField('backgroundImage')"
            class="form-text text-danger"
          >
            {{ getFieldError("backgroundImage") }}
          </span>
        </div>

        <div formGroupName="css">
          <div class="form-group mb-2">
            <label for="fontFamilyUrl">URL de la fuente:</label>
            <input
              type="text"
              id="fontFamilyUrl"
              formControlName="fontFamilyUrl"
              class="form-control"
            />
          </div>

          <!-- Text1 -->
          <div formGroupName="text1">
            <div class="form-group row mb-2">
              <div class="col-md-6">
                <label for="text1Top">Texto 1 - Top:</label>
                <input
                  type="number"
                  id="text1Top"
                  formControlName="top"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label for="text1Left">Texto 1 - Left:</label>
                <input
                  type="number"
                  id="text1Left"
                  formControlName="left"
                  class="form-control"
                />
              </div>
            </div>
            <div class="form-group row mb-2">
              <div class="col-md-6">
                <label for="text1FontFamily">Texto 1 - Fuente:</label>
                <input
                  type="text"
                  id="text1FontFamily"
                  formControlName="fontFamily"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label for="text1Color">Texto 1 - Color de texto:</label>
                <input
                  type="text"
                  id="text1Color"
                  formControlName="textColor"
                  class="form-control"
                />
              </div>
            </div>
            <div class="form-group row mb-2">
              <div class="col-md-6">
                <label for="text1FontSize">Texto 1 - Tamaño de fuente:</label>
                <input
                  type="number"
                  id="text1FontSize"
                  formControlName="fontSize"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label for="text1FontWeight">Texto 1 - Grosor de fuente:</label>
                <input
                  type="text"
                  id="text1FontWeight"
                  formControlName="fontWeight"
                  class="form-control"
                />
              </div>
            </div>
            <div class="form-group row mb-2">
              <div class="col-md-6">
                <label for="text1FontStyle">Texto 1 - Estilo de fuente:</label>
                <input
                  type="text"
                  id="text1FontStyle"
                  formControlName="fontStyle"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label for="text1LetterSpacing">Texto 1 - Espaciado:</label>
                <input
                  type="text"
                  id="text1LetterSpacing"
                  formControlName="letterSpacing"
                  class="form-control"
                />
              </div>
            </div>
            <div class="form-group row mb-2">
              <div class="col-md-6">
                <label for="text1LineHeight">Texto 1 - Altura de línea:</label>
                <input
                  type="text"
                  id="text1LineHeight"
                  formControlName="lineHeight"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label for="text1TextAlign"
                  >Texto 1 - Alineación de texto:</label
                >
                <input
                  type="text"
                  id="text1TextAlign"
                  formControlName="textAlign"
                  class="form-control"
                />
              </div>
            </div>
            <div class="form-group row mb-2">
              <div class="col-md-6">
                <label for="text1TextShadow">Texto 1 - Sombra:</label>
                <input
                  type="text"
                  id="text1TextShadow"
                  formControlName="textShadow"
                  class="form-control"
                />
              </div>
            </div>
          </div>

          <!-- Text2 -->
          <div formGroupName="text2">
            <div class="form-group row mb-2">
              <div class="col-md-6">
                <label for="text2Top">Texto 2 - Top:</label>
                <input
                  type="number"
                  id="text2Top"
                  formControlName="top"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label for="text2Left">Texto 2 - Left:</label>
                <input
                  type="number"
                  id="text2Left"
                  formControlName="left"
                  class="form-control"
                />
              </div>
            </div>
            <div class="form-group row mb-2">
              <div class="col-md-6">
                <label for="text2FontFamily">Texto 2 - Fuente:</label>
                <input
                  type="text"
                  id="text2FontFamily"
                  formControlName="fontFamily"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label for="text2Color">Texto 2 - Color de texto:</label>
                <input
                  type="text"
                  id="text2Color"
                  formControlName="textColor"
                  class="form-control"
                />
              </div>
            </div>
            <div class="form-group row mb-2">
              <div class="col-md-6">
                <label for="text2FontSize">Texto 2 - Tamaño de fuente:</label>
                <input
                  type="number"
                  id="text2FontSize"
                  formControlName="fontSize"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label for="text2FontWeight">Texto 2 - Grosor de fuente:</label>
                <input
                  type="text"
                  id="text2FontWeight"
                  formControlName="fontWeight"
                  class="form-control"
                />
              </div>
            </div>
            <div class="form-group row mb-2">
              <div class="col-md-6">
                <label for="text2FontStyle">Texto 2 - Estilo de fuente:</label>
                <input
                  type="text"
                  id="text2FontStyle"
                  formControlName="fontStyle"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label for="text2LetterSpacing">Texto 2 - Espaciado:</label>
                <input
                  type="text"
                  id="text2LetterSpacing"
                  formControlName="letterSpacing"
                  class="form-control"
                />
              </div>
            </div>
            <div class="form-group row mb-2">
              <div class="col-md-6">
                <label for="text2LineHeight">Texto 2 - Altura de línea:</label>
                <input
                  type="text"
                  id="text2LineHeight"
                  formControlName="lineHeight"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label for="text2TextAlign"
                  >Texto 2 - Alineación de texto:</label
                >
                <input
                  type="text"
                  id="text2TextAlign"
                  formControlName="textAlign"
                  class="form-control"
                />
              </div>
            </div>
            <div class="form-group row mb-2">
              <div class="col-md-6">
                <label for="text2TextShadow">Texto 2 - Sombra:</label>
                <input
                  type="text"
                  id="text2TextShadow"
                  formControlName="textShadow"
                  class="form-control"
                />
              </div>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Subir JSON</button>
      </form>
    </div>
    <!-- Columna para mostrar el JSON generado -->
    <div class="col-md-6">
      <div class="card mb-5 p-2" style="width: 100%; height: 50vh">
        <h5 class="card-title">Vista previa:</h5>
        <div
          *ngIf="!selectedImage; else selectedImageSection"
          class="card-body"
        >
          <p class="card-text">Todavía no has seleccionado imagen</p>
        </div>
        <ng-template #selectedImageSection>
          <iframe
            [srcdoc]="previewHTML"
            class="card-img-bottom"
            style="width: 100%; height: 100%"
          ></iframe>
        </ng-template>
      </div>

      <pre>{{ formValue | json }}</pre>
    </div>
  </div>
</div>
