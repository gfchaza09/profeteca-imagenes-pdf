<div class="container my-5">
  <div class="d-flex justify-content-center" *ngIf="loading">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div
    *ngIf="!loading && templates && templates.length === 0"
    class="alert alert-warning"
    role="alert"
  >
    No hay configuraciones cargadas.
  </div>

  <div class="container" *ngIf="!loading && templates && templates.length > 0">
    <table class="table">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Nombre</th>
          <th scope="col">Vista Previa</th>
          <th scope="col">Eliminar</th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="
            let template of templates
              | paginate : { itemsPerPage: limit, currentPage: page };
            let i = index
          "
        >
          <th scope="row">{{ (page - 1) * limit + i + 1 }}</th>
          <td>
            {{ template.nombre }}
          </td>
          <td>
            <button
              class="btn btn-outline-success"
              (click)="previewTemplate(template)"
            >
              <i class="fas fa-eye"></i>
            </button>
          </td>
          <td>
            <button
              class="btn btn-danger"
              (click)="onDeleteTemplate(template._id)"
            >
              <i class="fas fa-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
    <div
      class="container-fluid my-4 text-center d-flex align-items-center justify-content-center"
    >
      <pagination-controls
        class="my-pagination"
        (pageChange)="page = $event"
      ></pagination-controls>
    </div>
  </div>
</div>
