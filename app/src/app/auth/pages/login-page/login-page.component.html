<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-8">
      <div class="card">
        <img src="assets/icon.png" class="card-img-top p-4" alt="Profeteca" style="max-height: 120px; object-fit: contain" />
        <div class="card-header">
          <h4>Iniciar Sesión</h4>
        </div>
        <div class="card-body">
          <form autocomplete="off" [formGroup]="myForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="username" class="form-label">Usuario</label>
              <input
                type="text"
                class="form-control"
                id="username"
                formControlName="username"
                required
              />
              <span
                *ngIf="isValidField('username')"
                class="form-text text-danger"
              >
                {{ getFieldError("username") }}
              </span>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input
                type="password"
                class="form-control"
                id="password"
                formControlName="password"
                required
              />
              <span
                *ngIf="isValidField('password')"
                class="form-text text-danger"
              >
                {{ getFieldError("password") }}
              </span>
            </div>
            <button type="submit" class="btn btn-primary">
              Iniciar Sesión
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
