<div class="container mt-5">
  <h1>Generador de PDF</h1>
  <form [formGroup]="myForm">
    <div class="form-group mb-3">
      <label for="template">Selecciona un template:</label>
      <select id="template" formControlName="template" class="form-control">
        <option value="">Selecciona un template</option>
        <option
          *ngFor="let template of availableTemplates"
          [value]="template._id"
        >
          {{ template.nombre }}
        </option>
      </select>
      <span *ngIf="isValidField('template')" class="form-text text-danger">
        {{ getFieldError("template") }}
      </span>
    </div>
    <div class="form-group mb-3">
      <label for="id">ID:</label>
      <input
        type="text"
        id="id"
        formControlName="id"
        class="form-control"
        placeholder="Ingrese el ID"
      />
      <span *ngIf="isValidField('id')" class="form-text text-danger">
        {{ getFieldError("id") }}
      </span>
    </div>

    <button (click)="generatePDF()" class="btn btn-primary">Generar PDF</button>
  </form>
</div>
